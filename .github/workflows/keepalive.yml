name: Keep Streamlit Alive

# 防 Streamlit Cloud 免費 tier 嘅 app sleep
# 每 8 分鐘 ping 一次 (Streamlit ~30 分鐘 idle 先會 sleep)
# 確保用戶登入即時可用，唔需要等 cold start
on:
  schedule:
    - cron: '*/8 * * * *'   # 每 8 分鐘
  workflow_dispatch:         # 容許手動 trigger（用嚟 test）

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Minute.hk
        run: |
          echo "🏓 Pinging Minute.hk to prevent sleep at $(date -u)"

          # 優先打 Streamlit 內建 health endpoint (快 + 輕量)
          # 失敗 fallback 打主頁
          if curl -fsSL --max-time 90 \
              -A "GitHub-Actions-Keepalive/1.0" \
              "https://minute-hk-app.streamlit.app/_stcore/health" \
              -o /tmp/health.txt 2>&1; then
            echo "✅ Health check OK: $(cat /tmp/health.txt)"
          else
            echo "⚠️ Health endpoint failed, fallback to main URL..."
            curl -fsSL --max-time 90 \
              -A "GitHub-Actions-Keepalive/1.0" \
              "https://minute-hk-app.streamlit.app/" \
              -o /dev/null
            echo "✅ Main URL OK"
          fi

          echo "🎉 Keep-alive ping completed at $(date -u)"
